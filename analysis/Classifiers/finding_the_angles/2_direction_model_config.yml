arguments:
  backbone:
    ModelConfig:
      arguments:
        activation_layer: null
        add_global_variables_after_pooling: false
        add_norm_layer: false
        dynedge_layer_sizes: null
        features_subset: null
        global_pooling_schemes: [min, max, mean, sum]
        nb_inputs: 7
        nb_neighbours: 8
        post_processing_layer_sizes: null
        readout_layer_sizes: null
        skip_readout: false
      class_name: DynEdge
  data_representation:
    ModelConfig:
      arguments:
        columns: [0, 1, 2]
        detector:
          ModelConfig:
            arguments: {replace_with_identity: null}
            class_name: IceCube86
        distance_as_edge_feature: false
        dtype: torch.float32
        input_feature_names: [charge, dom_x, dom_y, dom_z, dom_time, rde,
            pmt_area]
        nb_nearest_neighbours: 8
        node_definition: null
        perturbation_dict: null
        seed: null
      class_name: KNNGraph
  gnn: null
  graph_definition: null
  optimizer_class: '!class torch.optim.adam Adam'
  optimizer_kwargs: {eps: 0.001, lr: 0.003}
  scheduler_class: '!class torch.optim.lr_scheduler ReduceLROnPlateau'
  scheduler_config: {frequency: 1, monitor: val_loss}
  scheduler_kwargs: {factor: 0.5, min_lr: 1e-05, patience: 2}
  tasks:
  - ModelConfig:
      arguments:
        hidden_size: 128
        loss_function:
          ModelConfig:
            arguments: {}
            class_name: VonMisesFisher3DLoss
        target_labels: [direction]
      class_name: DirectionReconstructionWithKappa
class_name: StandardModel
