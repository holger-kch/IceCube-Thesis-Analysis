# Configuration for Energy Reconstruction inference/validation
# Use with inference_run.py

# Mode: false = validation (truth available in DB), true = inference (data only)
data: false

# Paths
input_db:   "/groups/icecube/nielsdb/PID_classification/dbs/test.db"
output_csv: "/groups/icecube/nielsdb/GNN_inference/results/energy_recon_output.csv"
checkpoint: "/groups/icecube/nielsdb/LE_neutrino_model_Aug2025/GNN_energy_output/LE_MC_eq_1M/210326/checkpoints/GNN_Energy_LE_MC_eq_1M_210326-epoch=XX-val_loss=XXXX.ckpt"

# Processing
batch_size: 256
num_workers: 12
max_pulses_per_event: 500   # 0 = no filter

# Device
accelerator: 'gpu'   # 'gpu' or 'cpu'

# Model architecture — must match the training config exactly
model_params:
  pulsemap: 'SplitInIcePulses'
  pulse_features: ["dom_x", "dom_y", "dom_z", "dom_time", "charge", "rde"]
  nb_neighbours: 8
  global_pooling_schemes: ['max', 'mean', 'sum']
  dynedge_layer_sizes: [[256, 512], [512, 512], [512, 256], [256, 256]]
  post_processing_layer_sizes: [512, 256, 128]
  readout_layer_sizes: [256, 128]

# Optimizer params — only used to build the model object, not for training
training_params:
  optimizer_class: 'AdamW'
  learning_rate: 0.001
  eps: 1e-8
  scheduler_class: 'PiecewiseLinearLR'
  milestones: [0, 10, 20, 30, 40]
  factors:    [1, 0.75, 0.5, 0.25, 0.1]
