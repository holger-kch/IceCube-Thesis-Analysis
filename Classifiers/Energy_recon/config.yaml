# Configuration for training the DynEdge GNN Energy Reconstruction on muons lvl3 MC.
#
# Key variable controls:
#   n_events  : Number of events to train on (null = use all). Model output
#               naming reflects this value (e.g. 500k, 1M, all).
#   train_frac: Fraction of (sub)sampled events used for training; rest for val.
#
# Loss: LogCosh  L(E) = ln(cosh(R_E)),  R_E = ln(E_pred/GeV) - ln(E_true/GeV)
# Target label:  'energy'  (GeV, from truth table)

checkpoint_path: "None"
restore_full_training_state: False
model_date: "250326"               # date tag to distinguish runs; update per run
seed: 42                           # RNG seed for reproducible train/val split

# Input database (single file — train/val split done internally)
db_path: "/groups/icecube/petersen/GraphNetDatabaseRepository/osc_next_database_new_muons_peter/Merged_db/osc_next_level3_v2.00_genie_muongun_noise_120000_140000_160000_139008_888003_retro.db"

# Short label used in output paths and W&B run names
label: "muons_lvl3"

# Event count control
n_events: 500000    # null = all events; 500000 = 500k; 1000000 = 1M etc.
train_frac: 0.8     # fraction of n_events used for training, rest for validation

output_folder: /groups/icecube/holgerkc/Thesis_Analysis/Classifiers/Energy_recon/output

model_params:
  pulsemap: SplitInIcePulses
  # Features available in this DB: dom_x, dom_y, dom_z, dom_time, charge, rde,
  # is_bad_dom, is_bright_dom, is_errata_dom, is_saturated_dom, pmt_area, width
  # (no hlc column in this database)
  pulse_features: ["dom_x", "dom_y", "dom_z", "dom_time", "charge", "rde"]
  nb_neighbours: 8
  global_pooling_schemes: ["max", "mean", "sum"]
  dynedge_layer_sizes: [[256, 512], [512, 512], [512, 256], [256, 256]]
  post_processing_layer_sizes: [512, 256, 128]
  readout_layer_sizes: [256, 128]

training_params:
  n_epochs: 80
  patience: 10
  accelerator: "gpu"
  devices: 1
  batch_size: 192
  num_workers: 8
  optimizer_class: AdamW
  learning_rate: 0.00005
  eps: 1e-08
  scheduler_class: PiecewiseLinearLR
  milestones: [0, 10, 20, 30, 40, 80]
  factors:    [1, 0.75, 0.5, 0.25, 0.2, 0.1]

use_wandb: true
wandb_params:
  wandb_project: "GNN_energy_muons"
  log_every_n_steps: 500
