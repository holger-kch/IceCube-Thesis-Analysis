# Unified Configuration for GNN Validation/Inference
# This config supports tasks: PID (multiclass), Energy (regression), Track (binary),
#                              XYZ, AZ, AZXYZ, MUON_XY, MUON_DOCA, INELAS (inelasticity)

# Mode selection
data: false  # true = inference mode (no truth), false = validation mode (with truth)

# Input/Output paths
#input_db: '/lustre/hpc/project/icecube/Burnsample/databases/IC86.22/burnsample_IC8622_merged.db'  # Path to the input database
#input_db: '/lustre/hpc/project/icecube/Burnsample/databases/burnsample_oscNext_data_IC86.11-22_level3_v02.00_pass2.db'
#input_db:  '/groups/icecube/nielsdb/GNN_muon/MC_data/GNN_muon_upgrade_IC86_logit5.db'
#input_db: '/groups/icecube/nielsdb/LE_dbs/LE_MC_eq_1M_test.db'  # Path to the input database for inference/validation
input_db: "/groups/icecube/nielsdb/PID_classification/dbs/test.db"

output_csv: '/groups/icecube/nielsdb/GNN_inference/results/PID_191125_on_old_MC_500k.csv'  # Path to save the output CSV with predictions and truth

# Task selection: 'PID', 'E', 'T', 'XYZ', 'AZ', 'AZXYZ', 'MUON_XY', 'MUON_DOCA', or 'INELAS'
task: 'PID'  # PID = multiclass classification, E = energy regression, T = track classification,
                   # XYZ = position reconstruction, AZ = direction reconstruction,
                   # AZXYZ = combined direction+position, MUON_XY = XY position reconstruction for muons,
                   # MUON_DOCA = muon distance-of-closest-approach (doca_x, doca_y, doca_z),
                   # INELAS = inelasticity regression (y = 1 - E_track/E_nu), output in [0,1]

# Checkpoint path
checkpoint: "/groups/icecube/nielsdb/LE_neutrino_model_Aug2025/GNN_output/LE_MC_eq_1M/191125/checkpoints/GNN_Model_LE_MC_eq_1M_191125-epoch=22-val_loss=0.0562.ckpt"  # Path to the trained model checkpoint

# Processing parameters
batch_size: 256           #do not increase, will run out of memory
num_workers: 12
max_pulses_per_event: 500  # Filter events with too many pulses (0 = no filter)

# Device configuration
accelerator: 'gpu'  # 'gpu' or 'cpu'

# Model architecture parameters (must match training config)
model_params:
  pulsemap: 'SplitInIcePulses'
  pulse_features: ["dom_x", "dom_y", "dom_z", "dom_time", "charge", "rde"] #columns in pulsemap - added physics features
  #pulse_features: ["dom_x", "dom_y", "dom_z", 'dom_time', 'charge', 'rde', 'pmt_area', 'is_bright_dom', 'is_bad_dom', 'is_saturated_dom', 'is_errata_dom', 'hlc'] 
  #pulse_features: ["dom_x", "dom_y", "dom_z", 'dom_time', 'charge', 'rde', 'width', 'pmt_area', 'is_bright_dom', 'is_bad_dom', 'is_saturated_dom', 'is_errata_dom', 'hlc'] 
  nb_neighbours: 8
  global_pooling_schemes: ['max', 'mean', 'sum']
  dynedge_layer_sizes: [[256, 512], [512, 512], [512, 256], [256, 256]]  # Increased capacity
  post_processing_layer_sizes: [512, 256, 128]  # Added depth
  readout_layer_sizes: [256, 128]

# Optimizer parameters (needed for model building, not used in inference)
training_params:
  optimizer_class: 'AdamW'
  learning_rate: 0.001
  eps: 1e-8
  scheduler_class: 'PiecewiseLinearLR'
  milestones: [0,10,20, 30, 40]
  factors: [1, 0.75, 0.5, 0.25, 0.1]